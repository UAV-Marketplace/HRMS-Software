{% load i18n %}

<div id="widgetMessages"
     style="flex:1;min-height:0;overflow-y:auto;padding:12px 10px;
            display:flex;flex-direction:column;gap:2px;"
     hx-get="/chat/{{ conv.id }}/poll/"
     hx-trigger="every 4s"
     hx-swap="innerHTML">
    {% include "chat/partials/messages.html" with messages_qs=messages_qs viewer=viewer conv=conv %}
</div>

<div style="padding:8px 10px;border-top:1px solid #e5e7eb;background:#fafafa;flex-shrink:0;">
    <form hx-post="/chat/{{ conv.id }}/send/"
          hx-target="#widgetMessages"
          hx-swap="innerHTML"
          hx-on::after-request="this.reset();widgetScrollBottom();">
        {% csrf_token %}
        <div style="display:flex;gap:6px;align-items:flex-end;">
            <textarea name="message"
                      rows="1"
                      class="oh-input"
                      placeholder="{% trans 'Message HR… (Enter to send)' %}"
                      style="flex:1;resize:none;border-radius:18px;padding:8px 12px;
                             font-size:.84rem;min-height:36px;max-height:80px;
                             overflow-y:auto;line-height:1.4;"
                      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();this.form.requestSubmit();}"></textarea>
            <button type="submit"
                    style="width:36px;height:36px;border-radius:50%;flex-shrink:0;
                           background:#6366f1;border:none;color:#fff;
                           display:flex;align-items:center;justify-content:center;
                           cursor:pointer;transition:background .15s;"
                    onmouseover="this.style.background='#4f46e5'"
                    onmouseout="this.style.background='#6366f1'">
                <ion-icon name="send-outline" style="font-size:.9rem;display:block;"></ion-icon>
            </button>
        </div>
    </form>
</div>

<script>widgetScrollBottom();</script>
